name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/LANCommander.Mcp.Tests -c Release
      - run: node --test tests/setup.test.mjs
      - run: dotnet pack src/LANCommander.Mcp -c Release -o artifacts
      - name: Verify installable package
        shell: pwsh
        run: ./eng/Test-Package.ps1 -PackagePath artifacts/LANCommander.Mcp.0.2.0.nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: lancommander-mcp-plugin
          path: artifacts/*.nupkg
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lancommander-mcp-plugin
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --repo "$GITHUB_REPOSITORY" --generate-notes
